name: RHYTHM E OTA Bootstrap Android APK

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/rhythm-e-ota-bootstrap.yml'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build OTA-enabled preview APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
